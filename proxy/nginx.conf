# Reverse proxy for Supabase (REST, Auth, Realtime websockets).
# Replace api.example.ru and YOUR_PROJECT; certificates come from certbot.
limit_req_zone $binary_remote_addr zone=billiard_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=billiard_auth:10m rate=10r/m;

map $http_origin $billiard_block_origin {
    default 1;
    "" 0;
    "https://antonkuznetsov1911.github.io" 0;
    "https://localhost" 0;
    "capacitor://localhost" 0;
}

server {
    listen 443 ssl http2;
    server_name api.example.ru;

    ssl_certificate     /etc/letsencrypt/live/api.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ru/privkey.pem;

    client_max_body_size 2m;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # An absent Origin is allowed for native/non-browser clients. Authentication
    # and RLS remain mandatory even when the Origin is allowed.
    if ($billiard_block_origin = 1) { return 403; }

    location = /auth/v1/token {
        limit_req zone=billiard_auth burst=5 nodelay;
        proxy_pass https://YOUR_PROJECT.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host YOUR_PROJECT.supabase.co;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=billiard_api burst=30 nodelay;
        proxy_pass https://YOUR_PROJECT.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host YOUR_PROJECT.supabase.co;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Realtime (club updates) runs over websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.example.ru;
    return 301 https://api.example.ru$request_uri;
}
