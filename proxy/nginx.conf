# Reverse proxy for Supabase (REST, Auth, Realtime websockets).
# Replace api.example.ru and YOUR_PROJECT; certificates come from certbot.
server {
    listen 443 ssl http2;
    server_name api.example.ru;

    ssl_certificate     /etc/letsencrypt/live/api.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ru/privkey.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass https://YOUR_PROJECT.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_PROJECT.supabase.co;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Realtime (club updates) runs over websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.example.ru;
    return 301 https://$host$request_uri;
}
