name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      # Auth E2E intercept requests; use dummy public configuration, never live credentials.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://billiard-e2e.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_e2e_placeholder_only
      # UI tests: the real app in Chromium (start a game, taps, undo,
      # finish, trash, theme, CSV export, device wipe).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
